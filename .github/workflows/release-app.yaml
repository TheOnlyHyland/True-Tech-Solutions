name: "Release True Family Journal"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish immutable version images"
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: "true-family-journal-release"
  cancel-in-progress: false

jobs:
  prepare:
    name: "Validate release"
    if: "${{ !inputs.publish || github.ref == 'refs/heads/main' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      architectures: "${{ steps.info.outputs.architectures }}"
      build_matrix: "${{ steps.matrix.outputs.matrix }}"
      description: "${{ steps.normalize.outputs.description }}"
      image_name: "${{ steps.normalize.outputs.image_name }}"
      name: "${{ steps.normalize.outputs.name }}"
      registry_prefix: "${{ steps.normalize.outputs.registry_prefix }}"
      url: "${{ steps.normalize.outputs.url }}"
      version: "${{ steps.normalize.outputs.version }}"
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.14.6"

      - name: "Verify frozen release identity"
        run: >
          python scripts/release_identity.py check --require-bound
          --github-repository "${GITHUB_REPOSITORY}"

      - name: "Set up locked uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          version: "0.11.33"

      - name: "Install locked test environment"
        run: uv sync --locked

      - name: "Run Home Assistant integration tests"
        run: uv run --frozen pytest -q tests/ha

      - name: "Run pure safety contracts"
        run: uv run --frozen python -m unittest discover -s tests -p "test_*.py"

      - name: "Get App information"
        id: info
        uses: home-assistant/actions/helpers/info@e3fb68ebda13d88a0d695082f471ba2c83d025fb
        with:
          path: "./true_family_journal"

      - name: "Normalize App information"
        id: normalize
        env:
          DESCRIPTION: "${{ fromJSON(steps.info.outputs.description) }}"
          IMAGE: "${{ fromJSON(steps.info.outputs.image) }}"
          NAME: "${{ fromJSON(steps.info.outputs.name) }}"
          URL: "${{ fromJSON(steps.info.outputs.url) }}"
          VERSION: "${{ fromJSON(steps.info.outputs.version) }}"
        run: |
          echo "image_name=${IMAGE##*/}" >> "${GITHUB_OUTPUT}"
          echo "registry_prefix=${IMAGE%/*}" >> "${GITHUB_OUTPUT}"
          echo "description=${DESCRIPTION}" >> "${GITHUB_OUTPUT}"
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: "Prepare build matrix"
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          architectures: "${{ steps.info.outputs.architectures }}"
          image-name: "${{ steps.normalize.outputs.image_name }}"
          registry-prefix: "${{ steps.normalize.outputs.registry_prefix }}"

  preflight:
    name: "Reject an existing version tag"
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: "Require an unused Git tag"
        if: inputs.publish
        env:
          VERSION: "${{ needs.prepare.outputs.version }}"
        run: |
          set +e
          inspection="$(git ls-remote --exit-code --tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${VERSION}" 2>&1)"
          status=$?
          set -e
          case "${status}" in
            0)
              echo "Git tag ${VERSION} already exists" >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "Unable to prove Git tag ${VERSION} is unused" >&2
              echo "${inspection}" >&2
              exit 1
              ;;
          esac

      - name: "Log in to GHCR"
        if: inputs.publish
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Require an unused version tag"
        if: inputs.publish
        env:
          ARCHITECTURES: "${{ needs.prepare.outputs.architectures }}"
          IMAGE: "${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}"
          VERSION: "${{ needs.prepare.outputs.version }}"
        run: |
          images="${IMAGE}:${VERSION}"
          for arch in $(jq -r '.[]' <<< "${ARCHITECTURES}"); do
            images="${images} ${IMAGE%/*}/${arch}-${IMAGE##*/}:${VERSION}"
          done
          for candidate in ${images}; do
            if inspection=$(docker buildx imagetools inspect "${candidate}" 2>&1); then
              echo "Version tag ${candidate} already exists" >&2
              exit 1
            fi
            case "${inspection,,}" in
              *"manifest unknown"*|*"no such manifest"*|*"not found"*) ;;
              *)
                echo "Unable to prove version tag ${candidate} is unused" >&2
                echo "${inspection}" >&2
                exit 1
                ;;
            esac
          done

  build:
    name: "Build ${{ matrix.arch }}"
    needs:
      - prepare
      - preflight
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.prepare.outputs.build_matrix) }}"
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Build and optionally sign image"
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          arch: "${{ matrix.arch }}"
          cache-image-tag: "${{ needs.prepare.outputs.version }}"
          container-registry-password: "${{ secrets.GITHUB_TOKEN }}"
          context: "./true_family_journal"
          cosign: "true"
          image: "${{ matrix.image }}"
          image-tags: "${{ needs.prepare.outputs.version }}"
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: "${{ inputs.publish }}"
          version: "${{ needs.prepare.outputs.version }}"

  manifest:
    name: "Publish and verify manifest"
    if: inputs.publish
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: "Publish signed multi-architecture manifest"
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10
        with:
          architectures: "${{ needs.prepare.outputs.architectures }}"
          container-registry-password: "${{ secrets.GITHUB_TOKEN }}"
          cosign: "true"
          image-name: "${{ needs.prepare.outputs.image_name }}"
          image-tags: "${{ needs.prepare.outputs.version }}"
          registry-prefix: "${{ needs.prepare.outputs.registry_prefix }}"

      - name: "Verify published keyless signature"
        env:
          IMAGE: "${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}"
          VERSION: "${{ needs.prepare.outputs.version }}"
        run: |
          cosign verify "${IMAGE}:${VERSION}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-app.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
