[project]
name = "true-family-trv-replacement"
version = "0.0.0"
requires-python = "==3.14.6"
dependencies = []

[dependency-groups]
test = [
  "pytest-homeassistant-custom-component==0.13.348",
]

[tool.uv]
default-groups = [
  "test",
]
package = false
required-version = "==0.11.33"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "tests/ha",
]
pythonpath = [
  ".",
]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
